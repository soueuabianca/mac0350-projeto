name: CI Pipeline

on:
  push:
    branches:
      - ci
  pull_request:
    branches:
      - ci

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v5

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r backend/requirements.txt

    - name: Executar Testes Unitários
      env:
        PYTHONPATH: backend 
        NEO4J_URI: "bolt://dummy:7687"
        NEO4J_USERNAME: "dummy"
        NEO4J_PASSWORD: "dummy"
        NEO4J_DATABASE: "dummy"
      run: |
        pytest backend/tests/

  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v5

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalar Radon
      run: |
        python -m pip install --upgrade pip
        pip install radon

    - name: Extrair Métricas do Radon (JSON)
      run: |
        radon cc backend/app/ -j > radon_cc.json
        radon mi backend/app/ -j > radon_mi.json
        radon raw backend/app/ -j > radon_raw.json
        
    - name: Salvar Artefatos de Métricas
      uses: actions/upload-artifact@v5
      with:
        name: radon-metrics
        path: |
          radon_cc.json
          radon_mi.json
          radon_raw.json